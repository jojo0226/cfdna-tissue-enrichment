[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cfdna-tissue-enrichment"
version = "0.1.1"
description = "Standardised tissue / cell-type enrichment of plasma cfDNA coverage against chromatin-accessibility atlases"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.21", "pandas>=1.3", "scipy>=1.7", "statsmodels>=0.13", "matplotlib>=3.4"]

[project.optional-dependencies]
build = ["h5py", "pyliftover"]
docs = ["mkdocs-material>=9"]

[project.scripts]
cfdna-tissue-enrich = "cfdna_tissue_enrichment.cli:main"

[tool.setuptools]
packages = ["cfdna_tissue_enrichment"]
